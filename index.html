<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supply Hub</title></head>
<body style="font-family:Arial;padding:40px">Открываю последнюю версию…
<script>
(async function(){
 var go=function(n){location.replace('supply_v'+n+'.html'+location.hash)};
 try{
  var r=await fetch('https://api.github.com/repos/25081982kk-c/supply/contents/?t='+Date.now(),{cache:'no-store'});
  var f=await r.json();
  var v=f.map(function(x){var m=x.name.match(/^supply_v(\d+)\.html$/);return m?+m[1]:0});
  var n=Math.max.apply(null,v); if(n>0) return go(n);
 }catch(e){}
 var ids=[];for(var i=1;i<=200;i++)ids.push(i);
 var ok=await Promise.all(ids.map(function(i){return fetch('supply_v'+i+'.html',{method:'HEAD',cache:'no-store'}).then(function(r){return r.ok?i:0}).catch(function(){return 0})}));
 go(Math.max.apply(null,ok)||50);
})();
</script></body></html>
